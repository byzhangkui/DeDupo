[package]
name = "dedupo-core"
version = "0.1.0"
edition = "2021"
description = "Core deduplication engine for DeDupo"

[lib]
crate-type = ["staticlib"] # Compile as .a static library for FFI

[dependencies]
walkdir = "2"                                          # Recursive file traversal
blake3 = "1"                                           # High-performance hashing
rayon = "1.10"                                         # Data parallelism
rusqlite = { version = "0.32", features = ["bundled"] } # SQLite (bundled)
serde = { version = "1", features = ["derive"] }
serde_json = "1"                                       # FFI data exchange format
log = "0.4"
thiserror = "2"                                        # Error handling

[build-dependencies]
cbindgen = "0.27" # Auto-generate C header files
